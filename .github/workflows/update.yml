name: Update AI news wiki

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch and build
        run: python3 src/update_feed.py
      - name: Commit generated pages
        run: |
          git config user.name "ai-news-wiki bot"
          git config user.email "actions@users.noreply.github.com"
          git add raw wiki
          git diff --cached --quiet || git commit -m "Update AI news wiki"
          git push
